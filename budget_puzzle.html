<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Estimation Puzzle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 25px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            text-align: center;
            max-width: 900px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 6px;
            font-size: 1.4em;
        }
        
        .instructions {
            color: #666;
            font-size: 0.8em;
            line-height: 1.4;
        }
        
        .instructions strong {
            color: #667eea;
        }
        
        .canvas-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 20px;
        }
        
        canvas {
            display: block;
            cursor: grab;
            border-radius: 8px;
        }
        
        canvas:active {
            cursor: grabbing;
        }
        
        .legend {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            max-width: 900px;
        }
        
        .legend-item {
            display: inline-block;
            margin-right: 25px;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.9em;
        }
        
        .legend-color {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 8px;
            vertical-align: middle;
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Estimate Breakdown</h1>
        <div class="instructions">
            <strong>Left-click + drag:</strong> Resize a piece (others auto-fit) | 
            <strong>Right-click + drag:</strong> Move pieces | 
            <strong>Middle-click + drag:</strong> Rotate pieces | 
            <strong>Double-click:</strong> Hide/Show pieces<br>
            <strong>Click + drag dashed boundary:</strong> Adjust budget constraint
        </div>
        <button id="resetButton" style="margin-top: 10px; padding: 8px 20px; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 0.9em; cursor: pointer; font-weight: bold;">Reset Puzzle</button>
    </div>
    
    <div class="canvas-container">
        <canvas id="puzzleCanvas" width="1000" height="700"></canvas>
    </div>
    
    <div class="legend">
        <div class="legend-item">
            <span class="legend-color" style="background: #FF6B6B;"></span>
            <span>Structural</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #4ECDC4;"></span>
            <span>MEP</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #45B7D1;"></span>
            <span>Finishes</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #FFA07A;"></span>
            <span>Site Work</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #98D8C8;"></span>
            <span>Equipment</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #F7DC6F;"></span>
            <span>Specialties</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('puzzleCanvas');
        const ctx = canvas.getContext('2d');
        
        // Puzzle pieces with varied sizes that fit together like a real jigsaw puzzle
        // Starting position for the puzzle
        const startX = 200;
        const startY = 150;
        
        const initialPieces = [
            // Row 1
            { x: startX, y: startY, width: 140, height: 110, rotation: 0, color: '#FF6B6B', label: 'Structural', visible: true, row: 0, col: 0, tabs: { top: 0, right: 1, bottom: 1, left: 0 } },
            { x: startX + 140, y: startY, width: 165, height: 110, rotation: 0, color: '#4ECDC4', label: 'MEP', visible: true, row: 0, col: 1, tabs: { top: 0, right: -1, bottom: -1, left: -1 } },
            { x: startX + 305, y: startY, width: 135, height: 110, rotation: 0, color: '#45B7D1', label: 'Finishes', visible: true, row: 0, col: 2, tabs: { top: 0, right: 1, bottom: 1, left: 1 } },
            { x: startX + 440, y: startY, width: 160, height: 110, rotation: 0, color: '#FFA07A', label: 'Site Work', visible: true, row: 0, col: 3, tabs: { top: 0, right: 0, bottom: -1, left: -1 } },
            
            // Row 2
            { x: startX, y: startY + 110, width: 140, height: 125, rotation: 0, color: '#98D8C8', label: 'Equipment', visible: true, row: 1, col: 0, tabs: { top: -1, right: -1, bottom: 1, left: 0 } },
            { x: startX + 140, y: startY + 110, width: 165, height: 125, rotation: 0, color: '#F7DC6F', label: 'Specialties', visible: true, row: 1, col: 1, tabs: { top: 1, right: 1, bottom: -1, left: 1 } },
            { x: startX + 305, y: startY + 110, width: 135, height: 125, rotation: 0, color: '#85C1E2', label: 'Envelope', visible: true, row: 1, col: 2, tabs: { top: -1, right: -1, bottom: 1, left: -1 } },
            { x: startX + 440, y: startY + 110, width: 160, height: 125, rotation: 0, color: '#F8B88B', label: 'Roofing', visible: true, row: 1, col: 3, tabs: { top: 1, right: 0, bottom: -1, left: 1 } },
            
            // Row 3
            { x: startX, y: startY + 235, width: 140, height: 115, rotation: 0, color: '#FAD7A1', label: 'Glazing', visible: true, row: 2, col: 0, tabs: { top: -1, right: 1, bottom: -1, left: 0 } },
            { x: startX + 140, y: startY + 235, width: 165, height: 115, rotation: 0, color: '#D5A6BD', label: 'Casework', visible: true, row: 2, col: 1, tabs: { top: 1, right: -1, bottom: 1, left: -1 } },
            { x: startX + 305, y: startY + 235, width: 135, height: 115, rotation: 0, color: '#9FD3C7', label: 'Plumbing', visible: true, row: 2, col: 2, tabs: { top: -1, right: 1, bottom: -1, left: 1 } },
            { x: startX + 440, y: startY + 235, width: 160, height: 115, rotation: 0, color: '#C7CEEA', label: 'HVAC', visible: true, row: 2, col: 3, tabs: { top: 1, right: 0, bottom: 1, left: -1 } },
            
            // Row 4
            { x: startX, y: startY + 350, width: 140, height: 130, rotation: 0, color: '#FFB6B9', label: 'Electrical', visible: true, row: 3, col: 0, tabs: { top: 1, right: -1, bottom: 0, left: 0 } },
            { x: startX + 140, y: startY + 350, width: 165, height: 130, rotation: 0, color: '#BAE1FF', label: 'Fire Prot.', visible: true, row: 3, col: 1, tabs: { top: -1, right: 1, bottom: 0, left: 1 } },
            { x: startX + 305, y: startY + 350, width: 135, height: 130, rotation: 0, color: '#B4E7CE', label: 'Concrete', visible: true, row: 3, col: 2, tabs: { top: 1, right: -1, bottom: 0, left: -1 } },
            { x: startX + 440, y: startY + 350, width: 160, height: 130, rotation: 0, color: '#DDA15E', label: 'Masonry', visible: true, row: 3, col: 3, tabs: { top: -1, right: 0, bottom: 0, left: 1 } },
        ];
        
        const pieces = JSON.parse(JSON.stringify(initialPieces));

        const grid = {
            rows: 4,
            cols: 4,
            minColWidth: 70,
            minRowHeight: 70
        };

        const initialColWidths = [140, 165, 135, 160];
        const initialRowHeights = [110, 125, 115, 130];
        let colWidths = [...initialColWidths];
        let rowHeights = [...initialRowHeights];
        const puzzleSize = {
            width: initialColWidths.reduce((sum, value) => sum + value, 0),
            height: initialRowHeights.reduce((sum, value) => sum + value, 0)
        };
        
        // Budget boundary - perfectly fits the puzzle initially
        let boundary = {
            x: 170,
            y: 120,
            width: 630,
            height: 510
        };
        
        const initialBoundary = { x: 170, y: 120, width: 630, height: 510 };
        
        let selectedPiece = null;
        let selectedBoundaryEdge = null;
        let dragStart = { x: 0, y: 0 };
        let mouseButton = null;
        
        function drawPiece(piece) {
            if (!piece.visible) return;
            
            ctx.save();
            ctx.translate(piece.x + piece.width / 2, piece.y + piece.height / 2);
            ctx.rotate(piece.rotation);
            ctx.translate(-(piece.x + piece.width / 2), -(piece.y + piece.height / 2));
            
            // Draw puzzle piece shape with interlocking tabs
            ctx.fillStyle = piece.color;
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            
            const tabSize = 20;
            const tabPos = 0.5; // Position of tab along edge (0.5 = middle)
            
            ctx.beginPath();
            
            // Start at top-left corner
            ctx.moveTo(piece.x, piece.y);
            
            // Top edge with optional tab/slot
            if (piece.tabs.top === 0) {
                ctx.lineTo(piece.x + piece.width, piece.y);
            } else {
                const midX = piece.x + piece.width * tabPos;
                ctx.lineTo(midX - tabSize, piece.y);
                if (piece.tabs.top === 1) {
                    // Tab out
                    ctx.bezierCurveTo(
                        midX - tabSize, piece.y - tabSize * 0.5,
                        midX - tabSize * 0.5, piece.y - tabSize,
                        midX, piece.y - tabSize
                    );
                    ctx.bezierCurveTo(
                        midX + tabSize * 0.5, piece.y - tabSize,
                        midX + tabSize, piece.y - tabSize * 0.5,
                        midX + tabSize, piece.y
                    );
                } else {
                    // Slot in
                    ctx.bezierCurveTo(
                        midX - tabSize, piece.y + tabSize * 0.5,
                        midX - tabSize * 0.5, piece.y + tabSize,
                        midX, piece.y + tabSize
                    );
                    ctx.bezierCurveTo(
                        midX + tabSize * 0.5, piece.y + tabSize,
                        midX + tabSize, piece.y + tabSize * 0.5,
                        midX + tabSize, piece.y
                    );
                }
                ctx.lineTo(piece.x + piece.width, piece.y);
            }
            
            // Right edge with optional tab/slot
            if (piece.tabs.right === 0) {
                ctx.lineTo(piece.x + piece.width, piece.y + piece.height);
            } else {
                const midY = piece.y + piece.height * tabPos;
                ctx.lineTo(piece.x + piece.width, midY - tabSize);
                if (piece.tabs.right === 1) {
                    // Tab out
                    ctx.bezierCurveTo(
                        piece.x + piece.width + tabSize * 0.5, midY - tabSize,
                        piece.x + piece.width + tabSize, midY - tabSize * 0.5,
                        piece.x + piece.width + tabSize, midY
                    );
                    ctx.bezierCurveTo(
                        piece.x + piece.width + tabSize, midY + tabSize * 0.5,
                        piece.x + piece.width + tabSize * 0.5, midY + tabSize,
                        piece.x + piece.width, midY + tabSize
                    );
                } else {
                    // Slot in
                    ctx.bezierCurveTo(
                        piece.x + piece.width - tabSize * 0.5, midY - tabSize,
                        piece.x + piece.width - tabSize, midY - tabSize * 0.5,
                        piece.x + piece.width - tabSize, midY
                    );
                    ctx.bezierCurveTo(
                        piece.x + piece.width - tabSize, midY + tabSize * 0.5,
                        piece.x + piece.width - tabSize * 0.5, midY + tabSize,
                        piece.x + piece.width, midY + tabSize
                    );
                }
                ctx.lineTo(piece.x + piece.width, piece.y + piece.height);
            }
            
            // Bottom edge with optional tab/slot
            if (piece.tabs.bottom === 0) {
                ctx.lineTo(piece.x, piece.y + piece.height);
            } else {
                const midX = piece.x + piece.width * tabPos;
                ctx.lineTo(midX + tabSize, piece.y + piece.height);
                if (piece.tabs.bottom === 1) {
                    // Tab out
                    ctx.bezierCurveTo(
                        midX + tabSize, piece.y + piece.height + tabSize * 0.5,
                        midX + tabSize * 0.5, piece.y + piece.height + tabSize,
                        midX, piece.y + piece.height + tabSize
                    );
                    ctx.bezierCurveTo(
                        midX - tabSize * 0.5, piece.y + piece.height + tabSize,
                        midX - tabSize, piece.y + piece.height + tabSize * 0.5,
                        midX - tabSize, piece.y + piece.height
                    );
                } else {
                    // Slot in
                    ctx.bezierCurveTo(
                        midX + tabSize, piece.y + piece.height - tabSize * 0.5,
                        midX + tabSize * 0.5, piece.y + piece.height - tabSize,
                        midX, piece.y + piece.height - tabSize
                    );
                    ctx.bezierCurveTo(
                        midX - tabSize * 0.5, piece.y + piece.height - tabSize,
                        midX - tabSize, piece.y + piece.height - tabSize * 0.5,
                        midX - tabSize, piece.y + piece.height
                    );
                }
                ctx.lineTo(piece.x, piece.y + piece.height);
            }
            
            // Left edge with optional tab/slot
            if (piece.tabs.left === 0) {
                ctx.lineTo(piece.x, piece.y);
            } else {
                const midY = piece.y + piece.height * tabPos;
                ctx.lineTo(piece.x, midY + tabSize);
                if (piece.tabs.left === 1) {
                    // Tab out
                    ctx.bezierCurveTo(
                        piece.x - tabSize * 0.5, midY + tabSize,
                        piece.x - tabSize, midY + tabSize * 0.5,
                        piece.x - tabSize, midY
                    );
                    ctx.bezierCurveTo(
                        piece.x - tabSize, midY - tabSize * 0.5,
                        piece.x - tabSize * 0.5, midY - tabSize,
                        piece.x, midY - tabSize
                    );
                } else {
                    // Slot in
                    ctx.bezierCurveTo(
                        piece.x + tabSize * 0.5, midY + tabSize,
                        piece.x + tabSize, midY + tabSize * 0.5,
                        piece.x + tabSize, midY
                    );
                    ctx.bezierCurveTo(
                        piece.x + tabSize, midY - tabSize * 0.5,
                        piece.x + tabSize * 0.5, midY - tabSize,
                        piece.x, midY - tabSize
                    );
                }
                ctx.lineTo(piece.x, piece.y);
            }
            
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Draw label
            ctx.fillStyle = '#333';
            ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(piece.label, piece.x + piece.width / 2, piece.y + piece.height / 2);
            
            ctx.restore();
        }
        
        function drawBoundary() {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 10]);
            ctx.strokeRect(boundary.x, boundary.y, boundary.width, boundary.height);
            ctx.setLineDash([]);
            
            // Draw label
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('BUDGET CONSTRAINT', boundary.x + boundary.width / 2, boundary.y - 20);
            
            // Draw resize handles
            const handleSize = 10;
            ctx.fillStyle = '#667eea';
            // Corners
            ctx.fillRect(boundary.x - handleSize/2, boundary.y - handleSize/2, handleSize, handleSize);
            ctx.fillRect(boundary.x + boundary.width - handleSize/2, boundary.y - handleSize/2, handleSize, handleSize);
            ctx.fillRect(boundary.x - handleSize/2, boundary.y + boundary.height - handleSize/2, handleSize, handleSize);
            ctx.fillRect(boundary.x + boundary.width - handleSize/2, boundary.y + boundary.height - handleSize/2, handleSize, handleSize);
            // Edges
            ctx.fillRect(boundary.x + boundary.width/2 - handleSize/2, boundary.y - handleSize/2, handleSize, handleSize);
            ctx.fillRect(boundary.x + boundary.width/2 - handleSize/2, boundary.y + boundary.height - handleSize/2, handleSize, handleSize);
            ctx.fillRect(boundary.x - handleSize/2, boundary.y + boundary.height/2 - handleSize/2, handleSize, handleSize);
            ctx.fillRect(boundary.x + boundary.width - handleSize/2, boundary.y + boundary.height/2 - handleSize/2, handleSize, handleSize);
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBoundary();
            
            pieces.forEach(piece => {
                drawPiece(piece);
            });
        }
        
        function isPointInPiece(x, y, piece) {
            if (!piece.visible) return false;
            
            // Simple bounding box check (can be improved for rotation)
            const dx = x - (piece.x + piece.width / 2);
            const dy = y - (piece.y + piece.height / 2);
            const cos = Math.cos(-piece.rotation);
            const sin = Math.sin(-piece.rotation);
            const localX = dx * cos - dy * sin + piece.width / 2;
            const localY = dx * sin + dy * cos + piece.height / 2;
            
            return localX >= 0 && localX <= piece.width && localY >= 0 && localY <= piece.height;
        }
        
        function getBoundaryEdge(x, y) {
            const tolerance = 15;
            
            // Check corners first
            if (Math.abs(x - boundary.x) < tolerance && Math.abs(y - boundary.y) < tolerance) return 'top-left';
            if (Math.abs(x - (boundary.x + boundary.width)) < tolerance && Math.abs(y - boundary.y) < tolerance) return 'top-right';
            if (Math.abs(x - boundary.x) < tolerance && Math.abs(y - (boundary.y + boundary.height)) < tolerance) return 'bottom-left';
            if (Math.abs(x - (boundary.x + boundary.width)) < tolerance && Math.abs(y - (boundary.y + boundary.height)) < tolerance) return 'bottom-right';
            
            // Check edges
            if (Math.abs(y - boundary.y) < tolerance && x > boundary.x && x < boundary.x + boundary.width) return 'top';
            if (Math.abs(y - (boundary.y + boundary.height)) < tolerance && x > boundary.x && x < boundary.x + boundary.width) return 'bottom';
            if (Math.abs(x - boundary.x) < tolerance && y > boundary.y && y < boundary.y + boundary.height) return 'left';
            if (Math.abs(x - (boundary.x + boundary.width)) < tolerance && y > boundary.y && y < boundary.y + boundary.height) return 'right';
            
            return null;
        }

        function applyGridLayout() {
            const colOffsets = [];
            const rowOffsets = [];
            let runningX = startX;
            for (let col = 0; col < grid.cols; col++) {
                colOffsets[col] = runningX;
                runningX += colWidths[col];
            }
            let runningY = startY;
            for (let row = 0; row < grid.rows; row++) {
                rowOffsets[row] = runningY;
                runningY += rowHeights[row];
            }

            pieces.forEach(piece => {
                piece.x = colOffsets[piece.col];
                piece.y = rowOffsets[piece.row];
                piece.width = colWidths[piece.col];
                piece.height = rowHeights[piece.row];
            });
        }

        function distributeDelta(sizes, index, delta, minSize) {
            if (delta === 0) return;
            if (delta > 0) {
                const originalSize = sizes[index];
                const available = sizes.reduce((sum, size, i) => {
                    return i === index ? sum : sum + Math.max(0, size - minSize);
                }, 0);
                const appliedDelta = Math.min(delta, available);
                sizes[index] += appliedDelta;

                let remaining = sizes[index] - originalSize;
                const shrinkables = sizes.map((size, i) => {
                    return i === index ? 0 : Math.max(0, size - minSize);
                });
                const totalShrinkable = shrinkables.reduce((sum, value) => sum + value, 0);
                if (totalShrinkable > 0) {
                    sizes.forEach((size, i) => {
                        if (i === index) return;
                        const portion = (shrinkables[i] / totalShrinkable) * remaining;
                        sizes[i] -= portion;
                    });
                }
            } else {
                const originalSize = sizes[index];
                sizes[index] = Math.max(minSize, sizes[index] + delta);
                const appliedDelta = sizes[index] - originalSize;
                let remaining = -appliedDelta;
                const totalGrowable = sizes.reduce((sum, size, i) => {
                    return i === index ? sum : sum + size;
                }, 0);
                if (totalGrowable > 0) {
                    sizes.forEach((size, i) => {
                        if (i === index) return;
                        sizes[i] += (size / totalGrowable) * remaining;
                    });
                }
            }
        }

        function normalizeSizes(sizes, minSize, target) {
            let total = sizes.reduce((sum, value) => sum + value, 0);
            if (total === 0) return sizes;
            let scale = target / total;
            sizes = sizes.map(value => Math.max(minSize, value * scale));
            total = sizes.reduce((sum, value) => sum + value, 0);

            const delta = target - total;
            if (Math.abs(delta) < 0.01) return sizes;

            if (delta < 0) {
                const shrinkables = sizes.map(value => Math.max(0, value - minSize));
                const totalShrinkable = shrinkables.reduce((sum, value) => sum + value, 0);
                if (totalShrinkable > 0) {
                    sizes = sizes.map((value, i) => value - (shrinkables[i] / totalShrinkable) * Math.abs(delta));
                }
            } else {
                const totalGrowable = sizes.reduce((sum, value) => sum + value, 0);
                if (totalGrowable > 0) {
                    sizes = sizes.map(value => value + (value / totalGrowable) * delta);
                }
            }
            return sizes;
        }

        function resizeGrid(piece, dx, dy) {
            distributeDelta(colWidths, piece.col, dx, grid.minColWidth);
            distributeDelta(rowHeights, piece.row, dy, grid.minRowHeight);

            colWidths = normalizeSizes(colWidths, grid.minColWidth, puzzleSize.width);
            rowHeights = normalizeSizes(rowHeights, grid.minRowHeight, puzzleSize.height);
            applyGridLayout();
        }
        
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            mouseButton = e.button; // 0: left, 1: middle, 2: right
            dragStart = { x, y };
            
            // Check if clicking on boundary edge
            selectedBoundaryEdge = getBoundaryEdge(x, y);
            if (selectedBoundaryEdge) {
                selectedPiece = null;
                return;
            }
            
            // Find clicked piece (from top to bottom)
            for (let i = pieces.length - 1; i >= 0; i--) {
                if (isPointInPiece(x, y, pieces[i])) {
                    selectedPiece = pieces[i];
                    // Move to top
                    pieces.splice(i, 1);
                    pieces.push(selectedPiece);
                    break;
                }
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Update cursor based on boundary edge
            const edge = getBoundaryEdge(x, y);
            if (edge) {
                if (edge === 'top-left' || edge === 'bottom-right') canvas.style.cursor = 'nwse-resize';
                else if (edge === 'top-right' || edge === 'bottom-left') canvas.style.cursor = 'nesw-resize';
                else if (edge === 'top' || edge === 'bottom') canvas.style.cursor = 'ns-resize';
                else if (edge === 'left' || edge === 'right') canvas.style.cursor = 'ew-resize';
            } else {
                canvas.style.cursor = 'grab';
            }
            
            if (selectedBoundaryEdge && mouseButton === 0) {
                const dx = x - dragStart.x;
                const dy = y - dragStart.y;
                
                switch(selectedBoundaryEdge) {
                    case 'top-left':
                        boundary.width -= dx;
                        boundary.height -= dy;
                        boundary.x += dx;
                        boundary.y += dy;
                        break;
                    case 'top-right':
                        boundary.width += dx;
                        boundary.height -= dy;
                        boundary.y += dy;
                        break;
                    case 'bottom-left':
                        boundary.width -= dx;
                        boundary.height += dy;
                        boundary.x += dx;
                        break;
                    case 'bottom-right':
                        boundary.width += dx;
                        boundary.height += dy;
                        break;
                    case 'top':
                        boundary.height -= dy;
                        boundary.y += dy;
                        break;
                    case 'bottom':
                        boundary.height += dy;
                        break;
                    case 'left':
                        boundary.width -= dx;
                        boundary.x += dx;
                        break;
                    case 'right':
                        boundary.width += dx;
                        break;
                }
                
                // Ensure minimum size
                if (boundary.width < 100) boundary.width = 100;
                if (boundary.height < 100) boundary.height = 100;
                
                dragStart = { x, y };
                draw();
                return;
            }
            
            if (!selectedPiece) return;
            
            const dx = x - dragStart.x;
            const dy = y - dragStart.y;
            
            if (mouseButton === 0) {
                resizeGrid(selectedPiece, dx, dy);
            } else if (mouseButton === 2) {
                // Right click: move
                selectedPiece.x += dx;
                selectedPiece.y += dy;
            } else if (mouseButton === 1) {
                // Middle click: rotate
                const centerX = selectedPiece.x + selectedPiece.width / 2;
                const centerY = selectedPiece.y + selectedPiece.height / 2;
                const angle = Math.atan2(y - centerY, x - centerX) - Math.atan2(dragStart.y - centerY, dragStart.x - centerX);
                selectedPiece.rotation += angle;
            }
            
            dragStart = { x, y };
            draw();
        });
        
        canvas.addEventListener('mouseup', () => {
            selectedPiece = null;
            selectedBoundaryEdge = null;
            mouseButton = null;
        });
        
        canvas.addEventListener('dblclick', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            for (let piece of pieces) {
                if (isPointInPiece(x, y, piece)) {
                    piece.visible = !piece.visible;
                    draw();
                    break;
                }
            }
        });
        
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        // Reset button functionality
        document.getElementById('resetButton').addEventListener('click', () => {
            // Reset all pieces to initial state
            for (let i = 0; i < pieces.length; i++) {
                pieces[i].x = initialPieces[i].x;
                pieces[i].y = initialPieces[i].y;
                pieces[i].width = initialPieces[i].width;
                pieces[i].height = initialPieces[i].height;
                pieces[i].rotation = initialPieces[i].rotation;
                pieces[i].visible = initialPieces[i].visible;
            }

            colWidths = [...initialColWidths];
            rowHeights = [...initialRowHeights];
            applyGridLayout();
            
            // Reset boundary
            boundary.x = initialBoundary.x;
            boundary.y = initialBoundary.y;
            boundary.width = initialBoundary.width;
            boundary.height = initialBoundary.height;
            
            draw();
        });
        
        applyGridLayout();
        // Initial draw
        draw();
    </script>
</body>
</html>
